name: Telegram connection diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: findart-telegram-delivery
  cancel-in-progress: false

jobs:
  connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the failed run with gh and its original artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/telegram-diagnostic"
          gh run view 40922049953 --repo "$GITHUB_REPOSITORY" --log-failed > "$RUNNER_TEMP/telegram-diagnostic/failed.log"
          gh run download 40922049953 --repo "$GITHUB_REPOSITORY" --name telegram-content-review-40922049953 --dir "$RUNNER_TEMP/telegram-diagnostic/original"
          node -e 'const fs=require("node:fs"); const p=process.env.RUNNER_TEMP+"/telegram-diagnostic/original/run-report.json"; console.log("ORIGINAL_RUN_REPORT="+fs.readFileSync(p,"utf8"));'
      - name: Check token, private chat, partial deliveries and issue write access
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_STATE_ISSUE: ${{ vars.TELEGRAM_STATE_ISSUE }}
        with:
          script: |
            const fs = require('node:fs');
            const report = { run: context.runId, botTokenPresent: Boolean(process.env.TELEGRAM_BOT_TOKEN), chatIdPresent: Boolean(process.env.TELEGRAM_CHAT_ID), automaticDeliveryChanged: false };
            const token = (process.env.TELEGRAM_BOT_TOKEN || '').trim();
            const chatId = (process.env.TELEGRAM_CHAT_ID || '').trim();
            report.tokenFormatValid = /^\d+:[A-Za-z0-9_-]+$/.test(token);
            report.chatIdFormatValid = /^[1-9]\d*$/.test(chatId);
            async function telegram(method, fields = {}) {
              if (!['getMe', 'getChat'].includes(method)) throw new Error('Connection diagnostics cannot send Telegram messages.');
              try {
                const response = await fetch('https://api.telegram.org/bot' + token + '/' + method, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(fields), signal: AbortSignal.timeout(15000) });
                const raw = await response.text();
                let data;
                try { data = JSON.parse(raw); }
                catch { return { ok: false, code: 'non-json-http-' + response.status }; }
                return { ok: response.ok && data.ok, code: data.error_code || response.status, description: data.ok ? undefined : String(data.description || '').replaceAll(token, '[REDACTED]').replaceAll(chatId, '[CHAT_ID]'), result: data.result };
              } catch (error) { return { ok: false, code: String(error.cause?.code || error.code || error.name || 'transport-error').replace(/[^A-Za-z0-9_-]/g, '') }; }
            }
            const me = await telegram('getMe');
            report.getMe = { ok: me.ok, code: me.code, description: me.description, correctBot: me.result?.username?.toLowerCase() === 'findart_content_bot' };
            if (me.ok && report.getMe.correctBot && /^[1-9]\d*$/.test(chatId)) {
              const chat = await telegram('getChat', { chat_id: chatId });
              report.getChat = { ok: chat.ok, code: chat.code, description: chat.description, private: chat.result?.type === 'private', matchesConfiguredId: String(chat.result?.id) === chatId };
            } else report.getChat = { ok: false, skipped: true, reason: !me.ok ? 'token rejected' : !report.getMe.correctBot ? 'different bot token' : 'CHAT_ID is not a positive numeric private chat ID' };
            const issue = Number(process.env.TELEGRAM_STATE_ISSUE);
            try {
              const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: issue, per_page: 100 });
              const checkpoints = comments.filter(c => c.user?.login === 'github-actions[bot]' && c.body.startsWith('<!-- findart-telegram:v1 -->\n')).map(c => JSON.parse(c.body.slice('<!-- findart-telegram:v1 -->\n'.length)));
              report.deliveryCheckpoints = checkpoints.length;
              report.partialOrCompletedMessages = checkpoints.reduce((n, record) => n + Object.keys(record.steps || {}).length, 0);
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue, body: '<!-- findart-telegram-connection:v1 -->\nConnection diagnostic run ' + context.runId + '. getMe=' + me.ok + ', getChat=' + Boolean(report.getChat.ok) + '. No Telegram messages or media were sent by this diagnostic.' });
              report.issueWrite = { ok: true, issue };
            } catch (error) { report.issueWrite = { ok: false, status: error.status || 'request-failed' }; }
            report.ready = report.getMe.ok && report.getMe.correctBot && report.getChat.ok && report.getChat.private && report.getChat.matchesConfiguredId && report.issueWrite.ok && report.partialOrCompletedMessages === 0;
            fs.writeFileSync(process.env.RUNNER_TEMP + '/telegram-diagnostic/connection-report.json', JSON.stringify(report, null, 2));
            console.log('CONNECTION_REPORT=' + JSON.stringify(report));
            if (!report.ready) core.setFailed('Connection check failed. See the sanitized connection report; no content was sent.');
      - name: Check the actual production Telegram client without sending content
        if: always()
        uses: actions/github-script@v7
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        with:
          script: |
            const fs = require('node:fs');
            const { pathToFileURL } = require('node:url');
            const source = await github.rest.repos.getContent({ ...context.repo, path: 'scripts/telegram/telegram-client.mjs', ref: context.sha });
            const file = process.env.RUNNER_TEMP + '/findart-telegram-client.mjs';
            fs.writeFileSync(file, Buffer.from(source.data.content, 'base64'));
            const { TelegramClient } = await import(pathToFileURL(file).href);
            const client = new TelegramClient({ token: process.env.TELEGRAM_BOT_TOKEN, chatId: process.env.TELEGRAM_CHAT_ID, expectedUsername: 'FINDART_content_bot', attempts: 2 });
            await client.verifyPrivateChat();
            console.log('PRODUCTION_CLIENT_CONNECTION_OK: getMe and getChat confirmed; no content or media sent.');
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: telegram-connection-diagnostic-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/telegram-diagnostic/connection-report.json
            ${{ runner.temp }}/telegram-diagnostic/failed.log
            ${{ runner.temp }}/telegram-diagnostic/original/run-report.json
          retention-days: 7
