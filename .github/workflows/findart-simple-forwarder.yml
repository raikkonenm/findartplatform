name: Simple FINDART forwarder verification
on:
  push:
    branches: [codex/telegram-submissions]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: findart-telegram-delivery
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:forwarder
      - run: npm run test:telegram
      - name: Send one synthetic submission
        if: vars.FINDART_FORWARDER_TEST_ENABLED == 'true'
        run: node scripts/gmail-forwarder/live-test.mjs
        env:
          FINDART_FORWARDER_TEST_ENABLED: ${{ vars.FINDART_FORWARDER_TEST_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
      # Test fixtures only. No real applicant content, artifacts, or issue writes.
