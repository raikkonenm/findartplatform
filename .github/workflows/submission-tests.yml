name: Submission privacy and pipeline tests
on:
  push:
    branches: [codex/telegram-submissions]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm install --no-save --package-lock=false --ignore-scripts @electric-sql/pglite@0.3.14
      - run: python -m pip install -r scripts/submissions/requirements.txt
      - run: npm run test:telegram
      - run: npm run test:submissions
        env:
          REQUIRE_PRIVATE_SQL_TESTS: 'true'
      # Synthetic fixtures only. No mailbox/AI/Telegram/storage secrets or artifacts.
