name: Private submission connection checks
on:
  push:
    branches: [codex/telegram-submissions]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: findart-telegram-delivery
  cancel-in-progress: false
jobs:
  connections:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify connections without sending content
        run: node scripts/submissions-connections.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUBMISSIONS_SUPABASE_URL: ${{ secrets.SUBMISSIONS_SUPABASE_URL }}
          SUBMISSIONS_SUPABASE_SECRET_KEY: ${{ secrets.SUBMISSIONS_SUPABASE_SECRET_KEY }}
          SUBMISSIONS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUBMISSIONS_SUPABASE_SERVICE_ROLE_KEY }}
          SUBMISSIONS_HMAC_KEY: ${{ secrets.SUBMISSIONS_HMAC_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUBMISSIONS_OPENAI_MODEL: ${{ vars.SUBMISSIONS_OPENAI_MODEL }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_SUBMISSIONS_ADDRESS: ${{ secrets.GMAIL_SUBMISSIONS_ADDRESS }}
          GMAIL_SUBMISSIONS_QUERY: ${{ secrets.GMAIL_SUBMISSIONS_QUERY }}
          GMAIL_SUBMISSIONS_START_AFTER: ${{ vars.GMAIL_SUBMISSIONS_START_AFTER }}
      # Fixed permission/connection flags only. No issues, applicant data,
      # draft artifacts, inbox polling or Telegram send methods.
